# Dev only, loaded automatically. Use with `docker compose up --watch`.
services:
  api:
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development

  worker:
    command: ["node", "--watch", "src/worker.js"]
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
