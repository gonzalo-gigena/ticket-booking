name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # common/ (portfolio-common must be public, same owner)
      - run: cp .env.example .env
      - name: Unit tests
        run: docker run --rm -v "$PWD/apps/api:/app" -w /app node:26.13-bookworm-slim node --test
      - name: Integration tests (auth, seat map) on 3 api replicas
        run: |
          c="docker compose -f compose.yaml"
          $c up -d --wait --build --scale api=3 || { $c logs; exit 1; }
          $c run --rm seed
          # --no-deps: otherwise `run` restarts the api at its default scale of 1
          $c --profile tools run --rm --no-deps -e MIN_REPLICAS=3 api-test || { $c logs api; exit 1; }
          $c --profile "*" down -v --remove-orphans # "*": every profile, so seed and the fakes go too
      - name: Stack with 3 api replicas + smoke test
        run: sh common/scripts/ci-stack.sh 3

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV" # GHCR needs lowercase
      # ponytail: QEMU for arm64. Switch to native arm64 runners + manifest merge if builds get slow.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
